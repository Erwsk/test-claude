name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verifications:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
